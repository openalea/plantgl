# Linux developer environment: compilers, build tools, test tools and the
# platform specific host libraries of conda/meta.yaml. Versions follow conda-forge; sysroot is pinned as in conda-forge-pinning.
# Use it with the host, runtime and optional dependencies of conda/ (see README):
#   mamba create -n plantgl-devel -f environment-linux.yaml \
#     -f conda/host_deps.yml -f conda/run_deps.yml -f conda/optional_deps.yml
name: plantgl-devel
channels:
  - conda-forge
dependencies:
    # build requirements of conda/meta.yaml (compiler('cxx'), stdlib('c'))
    - cxx-compiler
    - sysroot_linux-64=2.17
    - cmake
    - make
    - pkg-config
    - bison
    - flex
    # host requirements of conda/meta.yaml specific to Linux
    - libgl-devel
    - libglu
    # development
    - ipython
    - matplotlib-base
    # test
    - pytest
