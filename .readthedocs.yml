version: 2

build:
  os: "ubuntu-22.04"
  tools:
    python: "mambaforge-22.9"
  jobs:
    # add the documentation and optional dependencies to the published package environment
    pre_create_environment:
      - sed -n '/^dependencies:/,$p' doc/doc_deps.yml | tail -n +2 >> doc/environment.yaml
      - sed -n '/^dependencies:/,$p' conda/optional_deps.yml | tail -n +2 >> doc/environment.yaml

conda:
  environment: doc/environment.yaml

sphinx:
  # Path to your Sphinx configuration file.
  configuration: doc/conf.py

