version: 2

build:
  os: "ubuntu-22.04"
  tools:
    python: "mambaforge-22.9"
  jobs:
    # add the documentation and optional dependencies to the published package environment
    pre_create_environment:
      - sed -n '/^dependencies:/,$p' conda/doc_deps.yml | tail -n +2 >> conda/environment_rtd.yml
      - sed -n '/^dependencies:/,$p' conda/optional_deps.yml | tail -n +2 >> conda/environment_rtd.yml

conda:
  environment: conda/environment_rtd.yml

sphinx:
  # Path to your Sphinx configuration file.
  configuration: doc/conf.py

