# macOS (Intel and Apple Silicon) developer environment: compilers, build tools, test tools and the
# platform specific host libraries of conda/meta.yaml. Versions follow conda-forge.
# Xcode Command Line Tools are required (SDK and OpenGL framework).
name: plantgl-devel
channels:
  - conda-forge
dependencies:
    # build requirements of conda/meta.yaml (compiler('cxx'))
    - cxx-compiler
    - cmake
    - make
    - bison
    - flex
    # development
    - ipython
    # test
    - matplotlib-base
    # host
    - pip
    - setuptools-scm
    - scikit-build-core
    - numpy
    - qt-main
    - pyqt
    - gmp
    - mpfr
    - libpng
    - libjpeg-turbo
    - zlib
    - cgal-cpp
    - ann
    # CMake finds Eigen3 and Qhull, but never defines PGL_WITH_EIGEN / PGL_WITH_QHULL,
    # so the code using them is compiled out. Uncomment when enabling them in CMake.
    # - eigen
    # - qhull
    - libboost-devel
    - libboost-python-devel
    # run
    - pyopengl
    - pyqglviewer
    # doc
    - pandoc