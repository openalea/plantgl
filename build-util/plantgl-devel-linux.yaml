# Linux developer environment: compilers, build tools, test tools and the
# platform specific host libraries of conda/meta.yaml. Versions follow conda-forge; sysroot is pinned as in conda-forge-pinning.
name: plantgl-devel
channels:
  - openalea3/label/dev
  - openalea3/label/rc
  - openalea3
  - conda-forge
dependencies:
    # build requirements of conda/meta.yaml (compiler('cxx'), stdlib('c'))
    - cxx-compiler
    - sysroot_linux-64=2.17
    - cmake
    - make
    - pkg-config
    - bison
    - flex
    # host requirements of conda/meta.yaml specific to Linux
    - libgl-devel
    - libglu
    # development
    - ipython
    # test
    - matplotlib-base
    # host
    - pip
    - setuptools-scm
    - scikit-build-core
    - numpy
    - qt-main
    - pyqt
    - gmp
    - mpfr
    - libpng
    - libjpeg-turbo
    - zlib
    - cgal-cpp
    - ann
    # CMake finds Eigen3 and Qhull, but never defines PGL_WITH_EIGEN / PGL_WITH_QHULL,
    # so the code using them is compiled out. Uncomment when enabling them in CMake.
    # - eigen
    # - qhull
    - libboost-devel
    - libboost-python-devel
    # run
    - pyopengl
    - pyqglviewer
    # doc
    - pandoc

