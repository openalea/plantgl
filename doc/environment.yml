# Read the Docs environment: the latest published openalea.plantgl, dev and rc builds
# included. The documentation describes this package, not the checkout.
# The dependencies of doc/doc_deps.yml are appended to this file before the env is
# created (see .readthedocs.yml): keep `dependencies:` last.
name: plantgl-doc
channels:
  - openalea3/label/dev
  - openalea3/label/rc
  - openalea3
  - conda-forge
dependencies:
  - openalea.plantgl
