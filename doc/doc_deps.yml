# Documentation (Sphinx) dependencies.
# - Read the Docs adds them to doc/environment.yaml before creating its env
#   (see .readthedocs.yml).
# - Developers: add -f doc/doc_deps.yml to the mamba command of the README.
channels:
  - conda-forge
  - openalea3     # openalea.widgets
dependencies:
  - sphinx
  - pydata-sphinx-theme
  - myst-parser
  - sphinx-favicon
  - sphinx-copybutton
  - nbsphinx
  - pandoc
  - graphviz          # dot, for the inheritance diagrams
  - ipykernel
  - ipython_genutils
