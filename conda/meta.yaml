{% set version = environ.get('SETUPTOOLS_SCM_PRETEND_VERSION', "0.0.0.dev") %}

package:
  name: openalea.plantgl
  version: {{ version }}

source:
  path: ..

about:
  home: https://github.com/openalea/plantgl
  license: Cecill-C
  summary: An open-source graphic toolkit for the creation, simulation and analysis of 3D virtual plants.

build:
  number: 0
  # Packages compiling against PlantGL (openalea.plantgl in their host) get this run pin.
  run_exports:
    - {{ pin_subpackage('openalea.plantgl', max_pin='x.x') }}
  script:
    - {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python
    - pip
    - setuptools-scm
    - scikit-build-core
    - numpy
    - qt-main
    - pyqt
    - gmp
    - mpfr
    - libpng
    - libjpeg-turbo
    - zlib
    - cgal-cpp
    - ann
    # eigen: CGAL Eigen3 support (principal_curvatures); qhull: convex hull fitting
    - eigen
    - qhull
    - libboost-devel
    - libboost-python-devel
    - libgl-devel                        # [linux]
    - libglu                             # [linux]

  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake
    - make                              # [unix]
    - pkg-config                        # [linux]
    - bison                             # [unix]
    - flex                              # [unix]
    - winflexbison                      # [win]

  run:
    # ABI pins of the libraries linked (qt-main, pyqt, numpy, boost, png, jpeg, zlib,
    # gmp, mpfr, ann, GL) are added by the run_exports of the host packages.
    - python
    - numpy
    - pyopengl
    - pyqglviewer

  run_constrained:
    # MinGW (m2w64-*, msys2 based) libraries break PlantGL on Windows: their bin
    # directory comes before Library/bin in PATH, so their DLLs are loaded (#84).
    # All of them depend on msys2-conda-epoch, so prevent installing them by unsolvability:
    - msys2-conda-epoch <0.0a0          # [win]


test:
   requires:
     - pytest
     - matplotlib-base
     - pandas
   imports:
     - openalea.plantgl
     - openalea.plantgl.all
   source_files:
     - test/**
     - share/**
   commands:
     - cd test
     - pytest -v --ignore=tofix --ignore=ui --ignore=oatest  # [unix]
     - pytest -v --ignore=tofix --ignore=ui --ignore=oatest --ignore=test_shared_data.py  # [win]
