{% set version = environ.get('SETUPTOOLS_SCM_PRETEND_VERSION', "0.0.0.dev") %}
{# Host and runtime dependencies are declared in host_deps.yml and run_deps.yml, also
   used by developers. permit_undefined_jinja=False: fail if a file is missing. #}
{% set host_deps = load_file_data('host_deps.yml', from_recipe_dir=True, permit_undefined_jinja=False).get('dependencies', []) %}
{% set run_deps = load_file_data('run_deps.yml', from_recipe_dir=True, permit_undefined_jinja=False).get('dependencies', []) %}

package:
  name: openalea.plantgl
  version: {{ version }}

source:
  path: ..

about:
  home: https://github.com/openalea/plantgl
  license: Cecill-C
  summary: An open-source graphic toolkit for the creation, simulation and analysis of 3D virtual plants.

build:
  number: 0
  # Packages compiling against PlantGL (openalea.plantgl in their host) get this run pin.
  run_exports:
    - {{ pin_subpackage('openalea.plantgl', max_pin='x.x') }}
  script:
    - {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python
    # conda/host_deps.yml
    {% for dep in host_deps %}
    - {{ dep }}
    {% endfor %}
    # OpenGL::GL and OpenGL::GLU. X11 headers (included by GL/glx.h) and xcb come with
    # them and with qt-main; nothing links X11, xcb or Xfixes directly.
    - libgl-devel                        # [linux]
    - libglu                             # [linux]

  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake
    - pkg-config                        # [linux]
    - bison                             # [unix]
    - flex                              # [unix]
    # win_bison / win_flex on Windows, found by CMake
    - winflexbison                      # [win]
    - make                              # [unix]

  run:
    # ABI pins of the libraries linked (qt-main, pyqt, numpy, boost, png, jpeg, zlib,
    # gmp, mpfr, ann, GL) are added by the run_exports of the host packages.
    - python
    # conda/run_deps.yml
    {% for dep in run_deps %}
    - {{ dep }}
    {% endfor %}

test:
   requires:
     - pytest
     # dependencies used by the tests
     - matplotlib-base
     - pandas
   imports:
     - openalea.plantgl
     - openalea.plantgl.all
   source_files:
     - test/**
     - share/**
   commands:
     - cd test
     - pytest -v --ignore=tofix --ignore=ui --ignore=oatest  # [unix]
     - pytest -v --ignore=tofix --ignore=ui --ignore=oatest --ignore=test_shared_data.py  # [win]
