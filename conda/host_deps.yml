# Host dependencies of openalea.plantgl, common to all platforms: the libraries and
# Python build tools the C++ code and the wrappers are built against.
channels:
  - conda-forge
dependencies:
  - pip
  - setuptools-scm
  - scikit-build-core
  - numpy
  - qt-main
  - pyqt
  - gmp
  - mpfr
  - libpng
  - libjpeg-turbo
  - zlib
  - cgal-cpp
  - ann
  # CMake finds Eigen3 and Qhull, but never defines PGL_WITH_EIGEN / PGL_WITH_QHULL,
  # so the code using them is compiled out. Uncomment when enabling them in CMake.
  # - eigen
  # - qhull
  - libboost-devel
  - libboost-python-devel
