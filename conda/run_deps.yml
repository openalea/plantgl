# Runtime dependencies of openalea.plantgl, always needed. Keep this list short: plantgl
# is a dependency of many packages (optional ones go in optional_deps.yml).
channels:
  - conda-forge
  - openalea3/label/dev
  - openalea3/label/rc
  - openalea3
dependencies:
  - numpy
  - pyopengl
  - pyqglviewer
