# Windows developer environment: compilers, build tools, test tools and the
# platform specific host libraries of conda/meta.yaml. Versions follow conda-forge.
# Visual Studio 2022 with the C++ tools is required: activation of the env sets
# up its compiler.
# Then add the host, runtime and optional dependencies:
#   conda env update -n plantgl-devel -f conda/build_deps.yml
#   conda env update -n plantgl-devel -f conda/run_deps.yml
#   conda env update -n plantgl-devel -f conda/optional_deps.yml
name: plantgl-devel
channels:
  - conda-forge
dependencies:
    # build requirements of conda/meta.yaml (compiler('cxx'))
    - cxx-compiler
    - cmake
    # win_bison / win_flex, found by CMake, as in conda/meta.yaml
    - winflexbison
    # test
    - pytest
