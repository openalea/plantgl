# Linux developer environment: compilers, build tools, test tools and the
# platform specific host libraries of conda/meta.yaml. Versions follow conda-forge; sysroot is pinned as in conda-forge-pinning.
# Then add the host, runtime and optional dependencies:
#   conda env update -n plantgl-devel -f conda/build_deps.yml
#   conda env update -n plantgl-devel -f conda/run_deps.yml
#   conda env update -n plantgl-devel -f conda/optional_deps.yml
name: plantgl-devel
channels:
  - conda-forge
dependencies:
    # build requirements of conda/meta.yaml (compiler('cxx'), stdlib('c'))
    - cxx-compiler
    - sysroot_linux-64=2.17
    - cmake
    - make
    - pkg-config
    - bison
    - flex
    # host requirements of conda/meta.yaml specific to Linux
    - libgl-devel
    - libglu
    # test
    - pytest
